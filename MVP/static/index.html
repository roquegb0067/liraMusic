<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Player de Música Moderno</title>
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  
  <!-- Botão para abrir a tela cheia do Player (Modal) -->
  
  <!-- Elemento Áudio Global -->
  <audio id="meu-audio" src="/static/Marino - Im Sorry Mom (Legendado) PT_BR(M4A_128K).m4a"></audio>
  
  <!-- MODAL / TELA DE REPRODUÇÃO AMBIENTE -->
  <dialog id="reprodutorModal" class="modal-reprodutor">
    <div class="modal-backdrop"></div>
    <div class="modal-content">
      
      <!-- Botão Fechar -->
      <button id="btn-fechar-modal" class="btn-fechar" aria-label="Fechar">
        <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M19 9l-7 7-7-7" />
        </svg>
      </button>
      
      <!-- Capa em Destaque -->
      <div id="capa-wrapper"></div>
      
      <!-- Informações da Música + Curtir -->
      <div class="modal-info-row">
        <div class="detalhes-musica">
          <h2 class="player-titulo">I'm Sorry Mom</h2>
          <span class="player-artista">Marino</span>
        </div>
        <button class="btn-like" aria-label="Curtir">
          <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
        </button>
      </div>
      
      <!-- Barra de Progresso Expandida -->
      <div class="progresso-container modal-progresso">
        <div class="barra-bg barra-interativa">
          <div class="barra-fill"></div>
        </div>
        <div class="tempos">
          <span class="tempo tempo-atual">0:00</span>
            <span class="tempo tempo-total">0:00</span>
          </div>
        </div>
        
        <!-- Controles Principais de Áudio -->
        <div class="modal-controles">
          <button class="btn-icon sec" aria-label="Aleatório">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M10.59 9.17L5.41 4 4 5.41l5.17 5.17 1.42-1.41zM14.5 4l2.04 2.04L4 18.59 5.41 20 17.96 7.45 20 9.5V4h-5.5zm.33 9.41l-1.41 1.41 3.13 3.13L14.5 20H20v-5.5l-2.04 2.04-3.13-3.13z" />
            </svg>
          </button>
          <button class="btn-icon sec" aria-label="Anterior">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" />
            </svg>
          </button>
          <button id="btn-play-pause" class="btn-control main-play" aria-label="Reproduzir/Pausar">
            <svg class="icone-play" viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M8 5v14l11-7z" />
            </svg>
            <svg class="icone-pause" viewBox="0 0 24 24" width="20" height="20" fill="currentColor" style="display:none;">
              <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
            </svg>
          </button>
          <button class="btn-icon sec" aria-label="Próxima">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor">
              <path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z" />
            </svg>
          </button>
          <button class="btn-icon sec" aria-label="Repetir">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor">
              <path d="M7 7h10v3l4-4-4-4v3H5v6h2V7zm10 10H7v-3l-4 4 4 4v-3h12v-6h-2v4z" />
            </svg>
          </button>
        </div>
        
      </div>
  </dialog>
  
  <!-- PLAYER FIXO INFERIOR (COMPACTO) -->
  <footer class="custom-player">
    <div class="player-info-container">
      <div class="linha-topo-info">
        <strong class="player-titulo">I'm Sorry Mom</strong>
        <button class="btn-like" aria-label="Curtir">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
          </svg>
        </button>
      </div>
      <span class="player-artista">Marino</span>
    </div>
    
    <div class="player-centro-compacto">
      <button class="btn-control main-play" aria-label="Play/Pause">
        <svg class="icone-play" viewBox="0 0 24 24" width="16" height="16" fill="currentColor">
          <path d="M8 5v14l11-7z" />
        </svg>
        <svg class="icone-pause" viewBox="0 0 24 24" width="16" height="16" fill="currentColor" style="display:none;">
          <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z" />
        </svg>
      </button>
      
      <div class="progresso-container">
        <span class="tempo tempo-atual">0:00</span>
        <div class="barra-bg barra-interativa">
          <div class="barra-fill"></div>
        </div>
        <span class="tempo tempo-total">0:00</span>
      </div>
    </div>
    
    <div class="player-volume">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="#b3b3b3">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02z" />
      </svg>
      <input type="range" class="volume-slider" min="0" max="1" step="0.05" value="1">
    </div>
  </footer>
  
  <script src="/MVP/static/script.js"></script>
  <script src="/MVP/static/capa.js" type="text/javascript" charset="utf-8"></script>
</body>

</html>
