[package]
name = "liraMusic"
version = "0.1.0"
edition = "2024"

[dependencies]
walkdir = "2.5"
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
rusqlite = "0.31.0"
r2d2 = "0.8"
r2d2_sqlite = "0.24"
serde = { version = "1.0", features = ["derive"] }
tower-http = { version = "0.5", features = ["fs", "cors"] } 
tower = "0.4"